<style>
/* Layout: full-screen 3D world; chunky "game UI" overlays (HUD, drawer panel, map) on top; a scrolling Simple view as fallback. Single bright look by design. */
:root{
  --sky:#8fd3ff; --sky2:#d9f1ff;
  --ink:#16202c; --paper:#ffffff; --paper2:#eef6fb;
  --yellow:#ffc21a; --blue:#1f8fff; --green:#3fbf4a; --red:#ff4d4d; --muted:#5a6b7d;
  --display:"Lilita One","Arial Black",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
body.simple-mode{overflow:auto}
canvas#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);padding:9px 14px;font-family:var(--display);font-size:17px;letter-spacing:.02em;box-shadow:0 4px 0 var(--ink);text-decoration:none;color:var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--yellow)}
.btn.blue{background:var(--blue);color:#fff}
.btn svg{width:20px;height:20px;flex:none}
.btn.highlight{background:var(--yellow);animation:glow 1.8s ease-in-out infinite}
.pointer{position:absolute;top:calc(100% + 6px);right:34px;width:30px;height:37px;pointer-events:none;filter:drop-shadow(0 3px 0 rgba(22,32,44,.35));animation:poke 1s ease-in-out infinite}
@keyframes poke{0%,100%{transform:translateY(6px) rotate(-8deg)}50%{transform:translateY(0) rotate(-8deg)}}
@keyframes glow{0%,100%{box-shadow:0 4px 0 var(--ink),0 0 0 0 rgba(255,194,26,.9)}50%{box-shadow:0 4px 0 var(--ink),0 0 0 9px rgba(255,194,26,0)}}

/* Loading */
#loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.load-card{width:min(440px,100%);text-align:center;display:grid;gap:18px;justify-items:center}
.brick{width:84px;height:84px;position:relative;animation:spin 1.4s cubic-bezier(.6,0,.4,1) infinite}
.brick i{position:absolute;inset:0;background:var(--red);border:4px solid var(--ink);border-radius:10px}
.brick b{position:absolute;width:24px;height:24px;border-radius:50%;background:#ff7a7a;border:3px solid var(--ink)}
@keyframes spin{0%{transform:rotate(0)}50%{transform:rotate(90deg)}100%{transform:rotate(180deg)}}
.load-title{font-family:var(--display);font-size:clamp(30px,7vw,44px);line-height:1;text-wrap:balance}
.load-sub{color:var(--muted);margin:0}
.bar{width:100%;height:22px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--green) 0 18px,#57d861 18px 36px);transition:width .25s}
#loadPct{font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.load-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.hint-low{font-size:13px;color:var(--muted);margin:0}

/* HUD */
.hud{position:fixed;z-index:10;display:flex;gap:10px;align-items:center}
.hud-tl{top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px))}
.hud-tr{top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
.chip{background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:6px 12px;box-shadow:0 4px 0 var(--ink);line-height:1.1}
.chip strong{font-family:var(--display);font-size:18px;display:block;font-weight:400}
.chip small{color:var(--muted);font-size:12px}
.hud .btn{padding:7px 11px;font-size:15px}
#help{position:fixed;z-index:9;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(22,32,44,.82);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;max-width:calc(100% - 32px);text-align:center;transition:opacity .4s}
kbd{font-family:var(--display);background:#fff;color:var(--ink);border-radius:6px;padding:1px 7px;border-bottom:3px solid #9fb0c0;font-size:13px}
#prompt{position:fixed;z-index:11;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:20px;padding:12px 20px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#prompt kbd{margin-left:4px}
#stick{position:fixed;z-index:10;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(22,32,44,.6);touch-action:none}
#stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}

/* Panel (drawer on desktop, sheet on phone) */
#panel{position:fixed;z-index:20;top:0;right:0;bottom:0;width:min(560px,100%);padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) 12px;display:flex}
.card{position:relative;flex:1;min-width:0;background:var(--paper);border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);overflow:auto;overscroll-behavior:contain;animation:slide .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.card .close{position:sticky;top:10px;float:right;margin:10px 10px 0 0;z-index:2;width:42px;height:42px;padding:0;justify-content:center;background:var(--red);color:#fff}
.zone{padding:22px 22px 28px;display:grid;gap:16px}
.zone>*{min-width:0}
.eyebrow{display:inline-block;justify-self:start;font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:8px;border:2px solid var(--ink);background:var(--yellow)}
.zone h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,40px);line-height:1;margin:0;text-wrap:balance}
.zone h3{font-family:var(--display);font-weight:400;font-size:21px;margin:6px 0 0}
.zone p{margin:0;line-height:1.6;max-width:65ch}
.lede{font-size:16.5px}
.role{font-weight:700;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{border:3px solid var(--ink);border-radius:12px;padding:10px;background:var(--paper2)}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.media-main{width:100%;max-width:100%;aspect-ratio:16/9;border-radius:12px;border:3px solid var(--ink);background:#0d1520;object-fit:cover;display:block}
.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.thumbs figure{margin:0;display:grid;gap:4px}
.thumbs img,.thumbs video{width:100%;max-width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;border:3px solid var(--ink);display:block;background:#0d1520}
.thumbs img{cursor:zoom-in}
.thumbs figcaption,.cap{font-size:12.5px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;font-weight:500;padding:4px 10px;border-radius:999px;border:2px solid var(--ink);background:var(--paper2)}
.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.list li{border:3px solid var(--ink);border-radius:12px;padding:12px 14px;display:grid;gap:4px;background:var(--paper)}
.list li.feature{background:#fff3c4}
.list li b{font-family:var(--display);font-weight:400;font-size:19px}
.list li span{color:var(--muted);font-size:14px;line-height:1.45}
.list .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.list .links a{font-size:13px;font-weight:700;color:var(--blue)}
.skillgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.skill{border:3px solid var(--ink);border-radius:12px;padding:12px;display:grid;gap:8px;align-content:start}
.skill b{font-family:var(--display);font-weight:400;font-size:19px;display:flex;align-items:center;gap:8px}
.skill b i{width:16px;height:16px;border-radius:4px;border:2px solid var(--ink);flex:none}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.badge-dev{background:var(--ink);color:#fff;border-color:var(--ink)}
.manga{border:3px solid var(--ink);border-radius:12px;aspect-ratio:16/8;max-width:100%;background:#fff radial-gradient(circle,#16202c 1.3px,transparent 1.6px) 0 0/9px 9px;display:grid;place-items:center;overflow:hidden;position:relative}
.manga::before{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,#fff 0 4deg,transparent 4deg 11deg)}
.manga span{position:relative;font-family:var(--display);font-size:clamp(44px,12vw,76px);letter-spacing:.06em;color:#fff;-webkit-text-stroke:3px var(--ink);text-shadow:6px 6px 0 var(--ink);transform:rotate(-4deg)}
.ideas{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.ideas div{border:2px solid var(--ink);border-radius:10px;padding:9px 11px;background:var(--paper2);display:grid;gap:3px}
.ideas img{width:100%;max-width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;border:2px solid var(--ink);margin-bottom:4px;cursor:zoom-in;display:block}
.zone h3[id]{scroll-margin-top:60px;margin-top:18px;padding-top:16px;border-top:3px dashed #c9d6e2;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ideas b{font-family:var(--display);font-weight:400;font-size:16px}
.ideas span{font-size:13px;color:var(--muted);line-height:1.4}
.mailbox{border:3px dashed var(--ink);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--paper2)}
.mailbox code{font-family:var(--body);font-weight:700;font-size:clamp(15px,4vw,19px);user-select:all;overflow-wrap:anywhere}
#copyNote{font-size:13px;color:var(--green);font-weight:700;min-height:1em}

/* Map */
#map{position:fixed;z-index:30;inset:0;display:grid;place-items:center;background:rgba(22,32,44,.45);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#map .card{flex:none;width:min(460px,100%);max-height:86vh;padding:18px;display:grid;gap:12px}
#map h2{font-family:var(--display);font-weight:400;margin:0;font-size:28px}
.maplist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.maplist button{text-align:left;border:3px solid var(--ink);border-radius:12px;background:var(--paper);padding:9px 11px;display:flex;gap:9px;align-items:center;font-family:var(--display);font-size:16px;box-shadow:0 3px 0 var(--ink)}
.maplist button i{width:14px;height:14px;border-radius:4px;border:2px solid var(--ink);flex:none}

#lightbox{position:fixed;inset:0;z-index:40;background:rgba(10,15,22,.9);display:grid;place-items:center;padding:16px;cursor:zoom-out}
#lightbox img{max-width:100%;max-height:88vh;border-radius:12px;border:3px solid #fff}

/* Simple view */
#simple{position:relative;z-index:5;min-height:100%;background:linear-gradient(180deg,var(--sky) 0,var(--sky2) 420px,var(--paper2) 900px)}
.s-wrap{max-width:860px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.s-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.s-hero{display:grid;gap:10px;padding:10px 0}
.s-hero h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,11vw,84px);line-height:.95;margin:0;color:#fff;-webkit-text-stroke:3px var(--ink);text-shadow:0 6px 0 var(--ink)}
.s-hero p{margin:0;font-size:18px;max-width:52ch;line-height:1.5}
.s-nav{display:flex;flex-wrap:wrap;gap:8px}
.s-nav a{font-weight:700;font-size:13.5px;color:var(--ink);text-decoration:none;border:2px solid var(--ink);border-radius:999px;padding:5px 12px;background:var(--paper)}
#simple .zone{background:var(--paper);border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink)}
@media (max-width:640px){
  #panel{top:auto;height:78%;width:100%;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .card{animation-name:rise}
  @keyframes rise{from{transform:translateY(40px)}to{transform:none}}
  .zone{padding:18px 16px 24px}
  .stats{grid-template-columns:1fr}
  .thumbs,.skillgrid,.ideas,.maplist{grid-template-columns:1fr}
  .chip small{display:none}
}
@media (pointer:coarse){
  #prompt{left:auto;right:max(16px,env(safe-area-inset-right,0px));transform:none;bottom:calc(52px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 180px);white-space:normal;font-size:18px}
  #help{bottom:auto;top:calc(76px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- Shared UI ---------- */
const $ = id => document.getElementById(id);
document.addEventListener("click", e => {
  const z = e.target.closest("[data-zoom]");
  if (z) { $("lbImg").src = z.src; $("lbImg").alt = z.alt; $("lightbox").hidden = false; return; }
  const j = e.target.closest("[data-jump]");
  if (j) {
    e.preventDefault();
    const box = j.closest(".card, .zone"), t = box && box.querySelector(j.getAttribute("href"));
    if (t) { const sc = j.closest(".card"); if (sc) sc.scrollTop = t.offsetTop - 50; else t.scrollIntoView({ behavior: "smooth" }); }
    return;
  }
  const c = e.target.closest("[data-copy]");
  if (c) {
    const note = c.closest(".mailbox").querySelector("#copyNote") || $("copyNote");
    const done = ok => { note.textContent = ok ? "Email copied" : "Select the address above to copy it"; };
    try { navigator.clipboard.writeText(EMAIL).then(()=>done(true), ()=>{ selectEmail(c); done(false); }); }
    catch { selectEmail(c); done(false); }

});
function selectEmail(c){ const t=c.closest(".mailbox").querySelector("code"); const r=document.createRange(); r.selectNodeContents(t); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
$("lightbox").onclick = () => { $("lightbox").hidden = true; };

      <header class="s-hero"><h1>A. Saboor</h1><p>Game Designer, Game Developer, and Industry and Community Builder. Building games, communities and opportunities across the gaming industry.</p></header>
      <nav class="s-nav" aria-label="Sections">${ZONES.map(z=>`<a href="#${z.id}">${z.name}</a>`).join("")}</nav>
      ${ZONES.map(z=>`<section class="zone" id="${z.id}">${z.html().replace(/id="panelTitle"/,"")}</section>`).join("")}
    </div>`;
    s.dataset.built = 1;
    const b = $("back3d"); if (b) b.onclick = () => { s.hidden = true; document.body.classList.remove("simple-mode"); window.__enter && window.__enter(); };

  $("loader").hidden = true; ["hudL","hudR","help","prompt","stick","panel"].forEach(i=>$(i).hidden=true);

/* ---------- Loading ---------- */
let progress = 0;
function setLoad(p, msg){ progress = Math.max(progress, p); $("loadBar").style.width = progress + "%"; $("loadPct").textContent = Math.round(progress) + "%"; if (msg) $("loadMsg").textContent = msg; }
function readyToEnter(){ setLoad(100, "World ready"); $("loadActions").hidden = false; $("enterBtn").focus(); }
$("simpleBtn").onclick = showSimple;
$("toSimple").onclick = showSimple;

window.__webgl = (() => { try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); } catch { return false; } })();
const lowEnd = (navigator.deviceMemory && navigator.deviceMemory <= 2) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2);
if (lowEnd) $("lowHint").hidden = false;
if (!window.__webgl) { showSimple(); }
else boot();

async function boot(){
  setLoad(8, "Downloading the engine");
  let THREE;
  const fail = setTimeout(() => { $("loadMsg").textContent = "This is taking a while. Simple view works right away."; $("loadActions").hidden = false; $("enterBtn").hidden = true; }, 15000);
  const CDN = "https://cdn.jsdelivr.net/npm/three@0.160.0/";
  try { THREE = { ...(await import(CDN + "build/three.module.js")) }; }
  catch (e) { clearTimeout(fail); showSimple(); return; }
  setLoad(30, "Polishing the paint");
  try { // optional extras: rounded parts and studio reflections (they import "three" through the import map)
    const [rb, re] = await Promise.all([import(CDN + "examples/jsm/geometries/RoundedBoxGeometry.js"), import(CDN + "examples/jsm/environments/RoomEnvironment.js")]);
    THREE.RoundedBoxGeometry = rb.RoundedBoxGeometry; THREE.RoomEnvironment = re.RoomEnvironment;
  } catch (e) { console.warn("extras unavailable", e); }
  setLoad(45, "Loading fonts");
  try { await Promise.race([document.fonts.load('64px "Lilita One"'), new Promise(r=>setTimeout(r,2500))]); } catch {}
  setLoad(60, "Building zones");
  await new Promise(r => setTimeout(r, 30));
  try { buildWorld(THREE); } catch (e) { console.error(e); clearTimeout(fail); showSimple(); return; }
  clearTimeout(fail);
  readyToEnter();
}

/* ---------- 3D world ---------- */
function buildWorld(THREE){
  const isTouch = matchMedia("(pointer: coarse)").matches;
  const canvas = $("world");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: !lowEnd, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(devicePixelRatio, lowEnd ? 1 : isTouch ? 1.5 : 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.08;
  const shadows = !lowEnd;
  renderer.shadowMap.enabled = shadows; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color("#9fd8ff");
  scene.fog = new THREE.Fog("#cdebff", 130, 300);
  const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 1, 700);
  if (THREE.RoomEnvironment && !lowEnd) { // soft studio reflections on the plastic
    const pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(new THREE.RoomEnvironment(), .04).texture; pm.dispose();
  }
  // gradient sky dome with a sun glow
  const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color("#3b9cff") }, mid: { value: new THREE.Color("#9fd8ff") }, bot: { value: new THREE.Color("#e8f7ff") }, sunDir: { value: new THREE.Vector3(.45, .6, .35).normalize() } },
    vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    fragmentShader: "uniform vec3 top, mid, bot, sunDir; varying vec3 vP; void main(){ float h = vP.y; vec3 c = h > 0.0 ? mix(mid, top, pow(h, .6)) : mix(mid, bot, min(1.0, -h * 4.0)); float s = max(dot(vP, sunDir), 0.0); c += vec3(1.0, .92, .75) * (pow(s, 400.0) * 1.2 + pow(s, 8.0) * .18); gl_FragColor = vec4(c, 1.0); }"
  }));
  scene.add(sky);

  scene.add(new THREE.HemisphereLight("#e3f4ff", "#5d8a43", scene.environment ? .75 : 1.25));
  const sun = new THREE.DirectionalLight("#fff1d6", 2.6);
  sun.castShadow = shadows;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left:-45, right:45, top:45, bottom:-45, near:1, far:160 });
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = .03; sun.shadow.radius = 3;
  scene.add(sun, sun.target);

  /* Stud texture: one stud per tile, multiplied with the part colour */
  const sc = document.createElement("canvas"); sc.width = sc.height = 64;
  const g = sc.getContext("2d");
  g.fillStyle = "#d4d4d4"; g.fillRect(0,0,64,64);
  g.fillStyle = "#a9a9a9"; g.beginPath(); g.arc(34,35,19,0,7); g.fill();
  g.fillStyle = "#e4e4e4"; g.beginPath(); g.arc(32,32,18,0,7); g.fill();
  g.strokeStyle = "#ffffff"; g.lineWidth = 4; g.beginPath(); g.arc(32,32,13,3.4,5.0); g.stroke();
  g.strokeStyle = "#bdbdbd"; g.lineWidth = 2; g.strokeRect(0,0,64,64);
  const studBase = new THREE.CanvasTexture(sc);
  studBase.colorSpace = THREE.SRGBColorSpace;
  studBase.wrapS = studBase.wrapT = THREE.RepeatWrapping;
  studBase.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const texCache = {}, matCache = {};
  const studTex = (w, d) => { const k = w + "x" + d; if (!texCache[k]) { const t = studBase.clone(); t.repeat.set(w, d); t.needsUpdate = true; texCache[k] = t; } return texCache[k]; };
  const mat = (color, w, d, opts={}) => {
    const k = color + (w ? `|${w}x${d}` : "") + (opts.emissive || "");
    if (!matCache[k]) matCache[k] = new THREE.MeshStandardMaterial({ color, roughness: .5, metalness: 0, envMapIntensity: .55, map: w ? studTex(w, d) : null, emissive: opts.emissive || "#000", emissiveIntensity: opts.emissive ? .6 : 0 });
    return matCache[k];
  };
  const boxGeo = new THREE.BoxGeometry(1,1,1);
  /* box: x,z centre, y = bottom; studs on top face */
  function box(parent, w, h, d, color, x=0, y=0, z=0, studs=true, opts={}){
    const side = mat(color, 0, 0, opts);
    const top = studs ? mat(color, Math.max(1, Math.round(w)), Math.max(1, Math.round(d)), opts) : side;
    const m = new THREE.Mesh(boxGeo, [side, side, top, side, side, side]);
    m.scale.set(w, h, d); m.position.set(x, y + h/2, z);
    m.castShadow = m.receiveShadow = shadows;
    parent.add(m); return m;
  }
  function cyl(parent, r, h, color, x=0, y=0, z=0, seg=20){
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), mat(color));
    m.position.set(x, y + h/2, z); m.castShadow = m.receiveShadow = shadows; parent.add(m); return m;
  }
  function ball(parent, r, color, x, y, z, sx=1, sy=1, sz=1){
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 18), mat(color));
    m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.castShadow = m.receiveShadow = shadows; parent.add(m); return m;
  }
  function label(text, sub, color="#ffffff", h=3.2){
    const c = document.createElement("canvas"), x = c.getContext("2d");
    const F = 84, S = 40;
    x.font = `${F}px "Lilita One", Arial Black, sans-serif`;
    const w1 = x.measureText(text).width; x.font = `${S}px Rubik, sans-serif`;
    const w2 = sub ? x.measureText(sub).width : 0;
    c.width = Math.ceil(Math.max(w1, w2) + 60); c.height = sub ? F + S + 50 : F + 36;
    x.textAlign = "center"; x.lineJoin = "round"; x.textBaseline = "top";
    x.font = `${F}px "Lilita One", Arial Black, sans-serif`;
    x.lineWidth = 14; x.strokeStyle = "#16202c"; x.strokeText(text, c.width/2, 14);
    x.fillStyle = color; x.fillText(text, c.width/2, 14);
    if (sub) { x.font = `700 ${S}px Rubik, sans-serif`; x.lineWidth = 9; x.strokeText(sub, c.width/2, F + 26); x.fillStyle = "#ffffff"; x.fillText(sub, c.width/2, F + 26); }
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthWrite: false }));
    const hh = sub ? h * 1.5 : h; s.scale.set(hh * c.width / c.height, hh, 1); return s;
  }

  const colliders = []; // {x,z,r}
  const rand = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

  /* Ground, water, roads */
  const R_WORLD = 100;
  box(scene, 200, 4, 200, "#5cbf4f", 0, -4, 0);
  // water with a scrolling ripple normal map, and a foam rim around the baseplate
  const wc = document.createElement("canvas"); wc.width = wc.height = 128; const wx = wc.getContext("2d");
  wx.fillStyle = "rgb(128,128,255)"; wx.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 70; i++) { const x = rand() * 128, y = rand() * 128, r = 4 + rand() * 10; const gr = wx.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, "rgba(160,160,255,.9)"); gr.addColorStop(1, "rgba(100,100,255,0)"); wx.fillStyle = gr; wx.fillRect(x - r, y - r, r * 2, r * 2); }
  const waterN = new THREE.CanvasTexture(wc); waterN.wrapS = waterN.wrapT = THREE.RepeatWrapping; waterN.repeat.set(40, 40);
  const water = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), new THREE.MeshStandardMaterial({ color: "#2f9be8", roughness: .12, metalness: .15, normalMap: waterN, normalScale: new THREE.Vector2(.35, .35), envMapIntensity: 1.2 }));
  water.rotation.x = -Math.PI/2; water.position.y = -2.6; water.receiveShadow = shadows; scene.add(water);
  [[0, -101, 206, 2], [0, 101, 206, 2], [-101, 0, 2, 206], [101, 0, 2, 206]].forEach(([x, z, w, d]) => box(scene, w, .3, d, "#f4fbff", x, -2.7, z, false).castShadow = false);
  /* grass tufts and flowers: two instanced draws for the whole baseplate */
  const tuftGeo = new THREE.ConeGeometry(.35, 1, 4); tuftGeo.translate(0, .5, 0);
  const tufts = new THREE.InstancedMesh(tuftGeo, new THREE.MeshStandardMaterial({ roughness: .8 }), lowEnd ? 250 : 900);
  const flowerGeo = new THREE.BoxGeometry(.45, .45, .45); flowerGeo.translate(0, .55, 0);
  const flowers = new THREE.InstancedMesh(flowerGeo,new THREE.MeshStandardMaterial({ roughness: .5 }), lowEnd ? 60 : 220);
  const GR = ["#4cb543", "#5fc94f", "#3e9f3a", "#6fd35a"], FL = ["#ffffff", "#ffd23f", "#ff6fa8", "#b38cff"];
  const scatterPos = [];
  function scatter(im, cols, sy){
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), s = new THREE.Vector3(), p = new THREE.Vector3(), c = new THREE.Color();
    for (let i = 0; i < im.count; i++) {
      const x = -96 + rand() * 192, z = -96 + rand() * 192, k = .6 + rand() * .8;
      scatterPos.push([im, i, x, z]);
      p.set(x, 0, z); e.set((rand() - .5) * .3, rand() * 6.3, (rand() - .5) * .3); q.setFromEuler(e); s.set(k, k * sy * (.7 + rand() * .6), k);
      im.setMatrixAt(i, m4.compose(p, q, s)); im.setColorAt(i, c.set(cols[(rand() * cols.length) | 0]));
    }
    scene.add(im);
  }
  scatter(tufts, GR, 1); scatter(flowers, FL, 1);
  // floating islands out on the water
  for (let i = 0; i < 9; i++) {
    const a = i / 9 * Math.PI * 2 + .3, r = 135 + rand() * 40, isl = new THREE.Group();
    isl.position.set(Math.sin(a) * r, 6 + rand() * 14, -Math.cos(a) * r); scene.add(isl);
    const w = 10 + rand() * 10;
    box(isl, w, 3, w, "#5cbf4f", 0, 0, 0); box(isl, w*.8, 3, w*.8, "#8a5a32", 0, -3, 0, false); box(isl, w*.45, 3, w*.45, "#6e4526", 0, -6, 0, false);
    tree(isl, 0, 3, 0, 1.2);
  }

  function tree(parent, x, y, z, s=1){
    box(parent, 1.2*s, 3*s, 1.2*s, "#7a4a24", x, y, z, false);
    box(parent, 4.4*s, 2*s, 4.4*s, "#2f9e44", x, y + 3*s, z);
    box(parent, 3*s, 1.8*s, 3*s, "#3cb551", x, y + 5*s, z);
    box(parent, 1.6*s, 1.2*s, 1.6*s, "#4fc962", x, y + 6.8*s, z);
  }

  /* Zones on a ring */

  part(body, RB(3.4, .14, .9, .06), red, 0, 2.35, 2.6);                     // rear wing
  [-1.7, 1.7].forEach(x => part(body, RB(.12, .6, 1, .05), red, x, 2.25, 2.6));
  const lampM = new THREE.MeshStandardMaterial({ color: "#fff8de", emissive: "#fff2b0", emissiveIntensity: 1.4 });
  const tailM = new THREE.MeshStandardMaterial({ color: "#ff4040", emissive: "#ff2020", emissiveIntensity: 1 });
  [-.7, .7].forEach(x => { part(body, RB(.45, .22, .1, .05), lampM, x, .95, -3.5); part(body, RB(.4, .18, .1, .04), tailM, x, 1.05, 2.72); });
  const plateC = document.createElement("canvas"); plateC.width = 128; plateC.height = 64; const pc = plateC.getContext("2d");
  pc.fillStyle = "#ffc21a"; pc.fillRect(0, 0, 128, 64); pc.fillStyle = "#16202c"; pc.font = '44px "Lilita One", Arial Black, sans-serif'; pc.textAlign = "center"; pc.fillText("JKR", 64, 48);
  const plateT = new THREE.CanvasTexture(plateC); plateT.colorSpace = THREE.SRGBColorSpace;
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(.9, .45), new THREE.MeshStandardMaterial({ map: plateT, roughness: .5 })); plate.position.set(0, .62, -3.71); plate.rotation.y = Math.PI; body.add(plate);
  const steer = new THREE.Group(); steer.position.set(0, 1.75, -.55); steer.rotation.x = -.9; body.add(steer);
  part(steer, new THREE.TorusGeometry(.42, .07, 8, 20), dark, 0, 0, 0); part(steer, new THREE.BoxGeometry(.8, .08, .08), dark, 0, 0, 0);
  part(body, new THREE.CylinderGeometry(.06, .06, 1.2, 8), dark, 0, 1.3, -.85).rotation.x = .65;
  const wheels = [];
  const tireGeo = new THREE.CylinderGeometry(.72, .72, .75, 22), rimGeo = new THREE.CylinderGeometry(.42, .42, .78, 16), tireM = new THREE.MeshStandardMaterial({ color: "#1a1c1f", roughness: .92 });
  [[-1.85,-1.95,.66],[1.85,-1.95,.66],[-1.9,1.75,.78],[1.9,1.75,.78]].forEach(([x, z, r]) => {
    const pivot = new THREE.Group(); pivot.position.set(x, r, z); kart.add(pivot);
    const w = new THREE.Group(); pivot.add(w);
    const s = r / .72;
    const t = part(w, tireGeo, tireM, 0, 0, 0); t.rotation.z = Math.PI / 2; t.scale.set(s, 1, s);
    const rim = part(w, rimGeo, chrome, 0, 0, 0); rim.rotation.z = Math.PI / 2; rim.scale.set(s, 1, s);
    for (let k = 0; k < 3; k++) { const sp = part(w, new THREE.BoxGeometry(.8, .1, .62 * s), plastic("#2a3038"), 0, 0, 0); sp.rotation.x = k * Math.PI / 3; }
    wheels.push({ pivot, w, front: z < 0 });
  });

  // Avatar: rounded R15-style parts, hoodie, jeans, hair and a classic face
  const SKIN = "#e7b48a";
  const skinM = plastic(SKIN), hoodM = plastic("#22252b"), jeanM = plastic("#3459a8"), hairM = plastic("#17130f"), shoeM = plastic("#f2f2f2");
  const rider = new THREE.Group(); rider.position.set(0, 1.3, .65); body.add(rider);
  const shirtC = document.createElement("canvas"); shirtC.width = shirtC.height = 128; const sc2 = shirtC.getContext("2d");
  sc2.fillStyle = "#22252b"; sc2.fillRect(0, 0, 128, 128); sc2.fillStyle = "#ffc21a"; sc2.font = '64px "Lilita One", Arial Black, sans-serif'; sc2.textAlign = "center"; sc2.fillText("J", 64, 84);
  sc2.strokeStyle = "#3a3f47"; sc2.lineWidth = 4; sc2.beginPath(); sc2.moveTo(44, 0); sc2.lineTo(64, 22); sc2.lineTo(84, 0); sc2.stroke();
  const shirtT = new THREE.CanvasTexture(shirtC); shirtT.colorSpace = THREE.SRGBColorSpace;
  part(rider, RB(1.9, 1.85, 1, .2), hoodM, 0, .95, 0);
  const logo = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.2), new THREE.MeshStandardMaterial({ map: shirtT, roughness: .6 })); logo.position.set(0, .95, -.51); logo.rotation.y = Math.PI; rider.add(logo);
  part(rider, RB(1.3, .4, .5, .15), hoodM, 0, 1.95, .35);                  // hood
  // legs bent forward into the cockpit
  [-.48, .48].forEach(x => { part(rider, RB(.85, .8, 1.9, .18), jeanM, x, .2, -.7); part(rider, RB(.85, .55, .6, .18), shoeM, x, .05, -1.75); });
  const arms = [-1.32, 1.32].map((x, i) => {
    const sh = new THREE.Group(); sh.position.set(x, 1.7, 0); rider.add(sh);
    part(sh, RB(.8, 1.6, .8, .2), hoodM, 0, -.75, 0);
    part(sh, RB(.72, .45, .72, .2), skinM, 0, -1.68, 0);
    sh.rotation.x = .9; sh.rotation.z = i ? -.28 : .28; // reach forward and in to the wheel
    return sh;
  });
  const armL = arms[0], armR = arms[1];
  const head = new THREE.Group(); head.position.set(0, 2.55, 0); rider.add(head);
  part(head, RB(1.25, 1.2, 1.2, .38), skinM, 0, 0, 0);
  part(head, RB(1.35, .45, 1.3, .2), hairM, 0, .52, .05);                   // hair cap
  part(head, RB(1.35, .7, .45, .18), hairM, 0, .2, .5);                     // back hair
  part(head, RB(.9, .28, .3, .12), hairM, -.15, .38, -.55).rotation.z = .25; // fringe
  const faceC = document.createElement("canvas"); faceC.width = faceC.height = 128; const fx = faceC.getContext("2d");
  fx.fillStyle = "#16202c"; fx.beginPath(); fx.ellipse(42, 52, 8, 12, 0, 0, 7); fx.ellipse(86, 52, 8, 12, 0, 0, 7); fx.fill();
  fx.fillStyle = "#fff"; fx.beginPath(); fx.arc(44, 47, 3, 0, 7); fx.arc(88, 47, 3, 0, 7); fx.fill();
  fx.lineWidth = 7; fx.lineCap = "round"; fx.strokeStyle = "#16202c"; fx.beginPath(); fx.arc(64, 70, 22, .4, Math.PI - .4); fx.stroke();
  const faceT = new THREE.CanvasTexture(faceC); faceT.colorSpace = THREE.SRGBColorSpace;
  const face = new THREE.Mesh(new THREE.PlaneGeometry(1.05, 1.05), new THREE.MeshStandardMaterial({ map: faceT, transparent: true, roughness: .5 })); face.position.set(0, -.05, -.61); face.rotation.y = Math.PI; head.add(face);
  const nameTag = label("W8Joker", null, "#ffffff", 1.3); nameTag.position.set(0, 6.6, 0); kart.add(nameTag);

  // exhaust and tyre dust: one Points cloud recycled
  const PUFFS = lowEnd ? 24 : 60;
  const puffGeo = new THREE.BufferGeometry(); const puffPos = new Float32Array(PUFFS * 3).fill(-999);
  puffGeo.setAttribute("position", new THREE.BufferAttribute(puffPos, 3));
  const pt = document.createElement("canvas"); pt.width = pt.height = 32; const px2 = pt.getContext("2d"); const pg = px2.createRadialGradient(16, 16, 0, 16, 16, 16); pg.addColorStop(0, "rgba(255,255,255,.9)"); pg.addColorStop(1, "rgba(255,255,255,0)"); px2.fillStyle = pg; px2.fillRect(0, 0, 32, 32);
  const puffs = new THREE.Points(puffGeo, new THREE.PointsMaterial({ size: 1.4, map: new THREE.CanvasTexture(pt), transparent: true, opacity: .55, depthWrite: false, color: "#e9e4da" }));
  puffs.frustumCulled = false; scene.add(puffs);
  const puffLife = new Float32Array(PUFFS); let puffI = 0, puffT = 0, idle = 0;
  const tmpV = new THREE.Vector3();
  function kartFx(dt, t){
    const sp = Math.abs(car.v);
    puffT -= dt;
    if (puffT <= 0) {
      puffT = sp > 6 ? .03 : .16;
      const src = sp > 6 ? [(puffI % 2 ? -1.9 : 1.9), .2, 2.2] : [(puffI % 2 ? -.4 : .4), 1.5, 3.2];
      tmpV.set(...src); kart.localToWorld(tmpV);
      puffPos.set([tmpV.x, tmpV.y, tmpV.z], puffI * 3); puffLife[puffI] = 1; puffI = (puffI + 1) % PUFFS;
    }
    for (let i = 0; i < PUFFS; i++) if (puffLife[i] > 0) { puffLife[i] -= dt * 1.6; puffPos[i*3+1] += dt * 1.2; if (puffLife[i] <= 0) puffPos[i*3+1] = -999; }
    puffGeo.attributes.position.needsUpdate = true;
    // idle wave after two seconds parked
    idle = sp < .5 ? idle + dt : 0;
    const wave = Math.min(1, Math.max(0, idle - 2));
    armR.rotation.x = .9 * (1 - wave) + wave * 2.9; armR.rotation.z = -.28 * (1 - wave) - wave * (.45 + Math.sin(t * 9) * .35);
    pipes.forEach((p, i) => p.position.y = 1.2 + Math.sin(t * 40 + i) * .015 * (sp > .5 ? 1 : .4));
  }

  /* Input */
  const keys = {};
  const stick = { x: 0, y: 0, on: false };
  let touched = false, moved = false;
  addEventListener("keydown", e => {
    if (window.__paused) return;
    const k = e.key.toLowerCase();
    if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k) && $("panel").hidden) e.preventDefault();
    keys[k] = true;
    if ((k === "e" || k === "enter") && active && $("panel").hidden && $("map").hidden) openZone(active.zd);
  });
  addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
  addEventListener("blur", () => { for (const k in keys) keys[k] = false; });
  const stickEl = $("stick"), knob = stickEl.querySelector("i");
  function stickMove(e){
    const r = stickEl.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
    let dx = (e.clientX - cx) / (r.width/2), dy = (e.clientY - cy) / (r.height/2); const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; }
    stick.x = dx; stick.y = dy; knob.style.transform = `translate(${dx*36}px,${dy*36}px)`;
  }
  stickEl.addEventListener("pointerdown", e => { stick.on = true; try { stickEl.setPointerCapture(e.pointerId); } catch {} stickMove(e); });
  stickEl.addEventListener("pointermove", e => stick.on && stickMove(e));
  const stickEnd = () => { stick.on = false; stick.x = stick.y = 0; knob.style.transform = ""; };
  stickEl.addEventListener("pointerup", stickEnd); stickEl.addEventListener("pointercancel", stickEnd);
  let zoom = 1;
  canvas.addEventListener("wheel", e => { zoom = Math.min(1.6, Math.max(.6, zoom + Math.sign(e.deltaY) * .08)); e.preventDefault(); }, { passive: false });

  /* Panels */
  let active = null;
  const panel = $("panel"), body_ = $("panelBody");
  function openZone(zd){
    body_.innerHTML = `<div class="zone">${zd.html()}</div>`;
    panel.hidden = false; $("panelCard").scrollTop = 0; $("prompt").hidden = true; $("closePanel").focus({ preventScroll: true });
  }
  function closePanel(){ panel.querySelectorAll("video").forEach(v => v.pause()); panel.hidden = true; body_.innerHTML = ""; active = null; canvas.focus?.(); }
  $("closePanel").onclick = closePanel;
  addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("lightbox").hidden) $("lightbox").hidden = true; else if (!$("map").hidden) $("map").hidden = true; else if (!panel.hidden) closePanel(); } });
  $("prompt").onclick = () => active && openZone(active.zd);
  $("mapList").innerHTML = ZONES.map((z, i) => `<button data-go="${i}"><i style="background:${z.color}"></i>${z.name}</button>`).join("") + `<button data-go="spawn"><i style="background:#9aa6b2"></i>Spawn</button>`;
  $("mapList").onclick = e => {
    const b = e.target.closest("[data-go]"); if (!b) return;
    $("map").hidden = true;
    if (b.dataset.go === "spawn") { car.x = 0; car.z = 6; car.h = 0; car.v = 0; return; }
    const o = zoneObjs[+b.dataset.go]; car.x = o.px * .97; car.z = o.pz * .97; car.h = Math.atan2(-o.px, -o.pz); car.v = 0; openZone(o.zd);
  };
  $("mapBtn").onclick = () => { $("map").hidden = false; $("mapList").querySelector("button").focus(); };
  $("closeMap").onclick = () => { $("map").hidden = true; };
  $("map").onclick = e => { if (e.target.id === "map") $("map").hidden = true; };

  /* Physics */
  const car = { x: 0, z: 6, h: 0, v: 0, steer: 0 };
  const camOff = new THREE.Vector3(20, 31, 34);
  const camPos = new THREE.Vector3(), look = new THREE.Vector3();
  const SCREEN_UP = Math.atan2(-camOff.x, -camOff.z); // heading for "up" on the stick
  function step(dt, t){
    let thr = 0, str = 0;
    const panelOpen = !panel.hidden || !$("map").hidden;
    if (!panelOpen) {
      if (keys.w || keys.arrowup) thr += 1;
      if (keys.s || keys.arrowdown) thr -= 1;
      if (keys.a || keys.arrowleft) str += 1;
      if (keys.d || keys.arrowright) str -= 1;
      if (stick.on && Math.hypot(stick.x, stick.y) > .15) {
        // steer toward the stick direction on screen
        const want = SCREEN_UP - Math.atan2(stick.x, -stick.y);
        let diff = want - car.h; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        str = Math.max(-1, Math.min(1, diff * 2.2)); thr = Math.min(1, Math.hypot(stick.x, stick.y)) * (Math.abs(diff) > 2.4 ? .4 : 1);
      }
    }
    if (thr || str) { if (!moved) { moved = true; $("help").style.opacity = 0; setTimeout(() => $("help").hidden = true, 500); } }
    const boost = keys.shift ? 1.35 : 1;
    const max = 26 * boost;
    car.v += thr * (thr * car.v < 0 ? 46 : 22) * dt;
    if (!thr) car.v *= Math.pow(.18, dt);
    car.v = Math.max(-11, Math.min(max, car.v));
    car.steer += (str - car.steer) * Math.min(1, dt * 8);
    car.h += car.steer * 2.1 * dt * Math.max(-1, Math.min(1, car.v / 7));
    car.x += -Math.sin(car.h) * car.v * dt; car.z += -Math.cos(car.h) * car.v * dt;
    // collisions
    const KR = 2.3;
    for (const c of colliders) {
      const dx = car.x - c.x, dz = car.z - c.z, d = Math.hypot(dx, dz), m = c.r + KR;
      if (d < m && d > 0.0001) { car.x = c.x + dx / d * m; car.z = c.z + dz / d * m; car.v *= .6; }
    }
    const dw = Math.hypot(car.x, car.z), lim = R_WORLD - 4;
    const ex = Math.max(Math.abs(car.x), Math.abs(car.z));
    if (ex > lim) { car.x = Math.max(-lim, Math.min(lim, car.x)); car.z = Math.max(-lim, Math.min(lim, car.z)); car.v *= .5; }
    kart.position.set(car.x, 0, car.z); kart.rotation.y = car.h;
    body.rotation.z = car.steer * Math.min(1, Math.abs(car.v) / 20) * .08;
    body.rotation.x = -thr * .03; body.position.y = Math.abs(Math.sin(t * 18)) * Math.min(1, Math.abs(car.v) / 26) * .06;
    head.rotation.y = car.steer * .35;
    wheels.forEach(w => { w.w.rotation.x -= car.v * dt / .72; if (w.front) w.pivot.rotation.y = car.steer * .45; });
    steer.rotation.z = car.steer * .9;
    kartFx(dt, t);
    // zones
    let near = null;
    for (const o of zoneObjs) { if (Math.hypot(o.px - car.x, o.pz - car.z) < 6) near = o; }
    if (near !== active) {
      active = near;
      const p = $("prompt");
      if (active && panel.hidden) { p.innerHTML = `Open ${active.zd.name}${isTouch ? "" : " <kbd>E</kbd>"}`; p.hidden = false; }
      else p.hidden = true;
    }
    // camera
    camPos.set(car.x, 0, car.z).addScaledVector(camOff, zoom * (camera.aspect < 1 ? 1.45 : 1));
    camera.position.lerp(camPos, 1 - Math.pow(.02, dt));
    look.set(car.x, 2, car.z); camera.lookAt(look);
    sun.position.set(car.x + 30, 60, car.z + 20); sun.target.position.set(car.x, 0, car.z);
  }
  function animate(dt, t){
    for (const o of zoneObjs) { o.beam.material.opacity = .12 + Math.sin(t * 2.4 + o.px) * .05 + (o === active ? .12 : 0); o.tag.position.y = o.base + Math.sin(t * 1.6 + o.pz) * .4; }
    animated.forEach(n => {
      const u = n.userData;
      if (u.spin) u.spin.rotation.y += dt * 1.2;
      if (u.spin2) u.spin2.rotation.z += dt * .6;
      if (u.bob) u.bob.position.y += Math.sin(t * 2) * dt * .5;
      if (u.beams) u.beams.forEach((b, i) => { b.rotation.z = Math.sin(t * 1.3 + i) * .5; b.rotation.x = Math.cos(t * 1.1 + i * .7) * .3; });
      if (u.flag)u.flag.rotation.x = Math.sin(t * 2) * .25;
      if (u.plane) { u.plane.position.set(-4 + Math.cos(t) * 5, 13 + Math.sin(t * 2) * .8, 2 + Math.sin(t) * 5); u.plane.rotation.y = -t; }
    });
    clouds.forEach(c => { c.position.x += dt * 1.5; if (c.position.x > 170) c.position.x = -170; });
  }
  const animated = []; scene.traverse(n => { if (n.userData && Object.keys(n.userData).length) animated.push(n); });

  addEventListener("resize", () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
  camera.position.set(car.x + camOff.x, camOff.y, car.z + camOff.z); camera.lookAt(0, 2, 6);
  renderer.render(scene, camera);

  let last = performance.now(), t = 0, running = false;
  function loop(now){
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!window.__paused && !document.hidden) { t += dt; step(dt, t); animate(dt, t); renderer.render(scene, camera); }
    requestAnimationFrame(loop);
  }
  window.__enter = () => {
    window.__paused = false;
    $("loader").hidden = true; $("hudL").hidden = $("hudR").hidden = false;
    $("stick").hidden = !isTouch;
    const h = $("help");
    h.innerHTML = isTouch ? "Drag the stick to drive. Stop on a glowing pad and tap the button." : "Drive with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows. Hold <kbd>Shift</kbd> to boost. Stop on a glowing pad and press <kbd>E</kbd>.";
    if (!moved) h.hidden = false;
    if (!running) { running = true; last = performance.now(); requestAnimationFrame(loop); }
    const hz = location.hash.slice(1), zi = ZONES.findIndex(z => z.id === hz);
    if (zi >= 0) { $("mapList").querySelector(`[data-go="${zi}"]`).click(); }
  };
  $("enterBtn").onclick = window.__enter;
}
</script>
